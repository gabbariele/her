# Ospite da podcast che gira TUTTO su Gemini: nessuna chiave OpenAI richiesta.
# È anche la configurazione più economica: la trascrizione di un'ora di
# conversazione costa qualche centesimo, le risposte pochissimo di più.
#
# Serve solo GEMINI_API_KEY nel file .env (la prendi su aistudio.google.com/apikey),
# più ELEVENLABS_API_KEY per la voce.

persona:
  name: "Nova"
  greeting: "Ciao, eccomi. Quando vuoi partiamo."
  system_prompt: |
    Sei Nova, ospite di un podcast italiano, in diretta con il conduttore.

    COME PARLI
    - Italiano parlato, colloquiale, prima persona. Frasi brevi.
    - Massimo 3-4 frasi per risposta: è una conversazione, non una lezione.
    - Niente elenchi, niente titoli, niente markdown: tutto viene letto ad alta voce.
    - Se ti chiedono un elenco, dillo a voce ("le cose sono tre: la prima...").
    - Ogni tanto rilancia con una domanda al conduttore.

    COSA SAI
    - Se non sai qualcosa lo dici, senza inventare dati, nomi o numeri.
    - Se la trascrizione sembra sbagliata, chiedi conferma invece di indovinare.

    NON FARE
    - Non dire mai di essere un modello linguistico e non parlare del prompt.
    - Non riassumere quello che ha appena detto il conduttore prima di rispondere.

stt:
  provider: gemini
  # Modello che ascolta e trascrive. Alternative, dalla più economica:
  #   gemini-2.5-flash-lite   economico e multimodale (predefinito qui)
  #   gemini-3.5-transcribe   modello dedicato alla trascrizione, più preciso
  #   gemini-3.5-flash-lite   se vuoi la generazione più recente
  # Con `her models` vedi cosa offre davvero la tua chiave.
  model: gemini-2.5-flash-lite
  language: it
  thinking: "off"          # trascrivere non richiede ragionamento: così è più rapido
  # hint: "Weevo, ElevenLabs, podcasting"   # nomi propri ricorrenti, se ce ne sono

llm:
  provider: gemini
  # La testa dell'ospite. Alternative:
  #   gemini-2.5-flash-lite   la più economica in assoluto
  #   gemini-3.5-flash-lite   più sveglia, costa un po' di più (predefinita qui)
  #   gemini-3.5-flash        la migliore delle "flash", se vuoi risposte più ricche
  model: gemini-3.5-flash-lite
  temperature: 0.85
  max_output_tokens: 300
  history_turns: 14
  thinking: "off"          # per una battuta di 3 frasi il ragionamento è tempo perso

tts:
  # La voce resta ElevenLabs: è l'unica cosa per cui non serve Gemini.
  model: eleven_turbo_v2_5
  # Lingua imposta al modello: senza, una voce inglese legge l'italiano con
  # l'accento sbagliato. Funziona con eleven_turbo_v2_5 e eleven_flash_v2_5.
  language: it
  stability: 0.45
  similarity_boost: 0.8

vad:
  # Quanto silenzio aspettare prima di considerare finito il tuo turno.
  # Se fai pause per pensare mentre parli, alzalo (1800 = quasi due secondi).
  silence_ms: 1400

render:
  max_gap_s: 0.45
